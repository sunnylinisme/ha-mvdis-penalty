name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest beautifulsoup4 requests pyyaml ruff
      - run: pytest
      - run: ruff check mvdis_penalty_backend/app mvdis_penalty_backend/tools tests
      - run: python -m compileall mvdis_penalty_backend/app mvdis_penalty_backend/tools
